{% extends "base.html" %}
{% block title %}Delete lesson — TeachFlow{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-3">Delete this lesson?</h1>
    <p>“{{ lesson.title }}” will be deleted. This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete it</button>
      <a class="btn btn-outline-secondary" href="{% url 'courses:detail' lesson.section.course.pk %}">Keep it</a>
    </form>
  </div>
</div>
{% endblock %}
