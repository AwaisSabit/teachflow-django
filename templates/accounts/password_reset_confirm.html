{% extends "base.html" %}
{% block title %}Choose a new password — TeachFlow{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-3">Choose a new password</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small" role="alert">{{ field.errors }}</div>{% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Set my new password</button>
    </form>
  </div>
</div>
{% endblock %}
