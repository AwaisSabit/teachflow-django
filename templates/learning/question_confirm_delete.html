{% extends "base.html" %}
{% block title %}Delete question — TeachFlow{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-3">Delete this question?</h1>
    <p>“{{ question.text }}” will be deleted. This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete it</button>
      <a class="btn btn-outline-secondary" href="{% url 'learning:quiz_manage' question.quiz.pk %}">Keep it</a>
    </form>
  </div>
</div>
{% endblock %}
